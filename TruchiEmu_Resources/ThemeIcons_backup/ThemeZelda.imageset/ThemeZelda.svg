<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente para tu app -->
  <g id="Zelda_Hyrule_Crest_Correct_Colors">
    
    <!-- Contorno Exterior (Bronce/Oro viejo) -->
    <circle cx="250" cy="250" r="180" fill="#4A3511" stroke="#2B1E0A" stroke-width="6" />
    
    <!-- Círculo Central (Verde Bosque de Hyrule) -->
    <circle cx="250" cy="250" r="155" fill="#0E4429" />
    
    <!-- Sombra interna -->
    <path d="M 250 95 C 335 95, 405 165, 405 250 C 405 335, 335 405, 250 405 Z" fill="#062616" opacity="0.5" />

    <!-- Anillos Místicos de Fondo -->
    <circle cx="250" cy="250" r="130" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10, 15" opacity="0.3" />

    <!-- LA TRIFUERZA (Poder, Sabiduría, Valor) -->
    <g id="Triforce" filter="drop-shadow(0px 0px 8px rgba(255, 215, 0, 0.6))">
      <polygon points="250,150 290,220 210,220" fill="#FFD700" stroke="#B59410" stroke-width="2" />
      <polygon points="210,220 250,290 170,290" fill="#FFE34D" stroke="#B59410" stroke-width="2" />
      <polygon points="290,220 330,290 250,290" fill="#D4AF37" stroke="#937508" stroke-width="2" />
    </g>

    <!-- EL NEBURÍ / CRESTA DE HYRULE CORREGIDA (Ahora en dorado legítimo) -->
    <!-- Ala Izquierda -->
    <path d="M 170 260 
             C 120 260, 100 290, 105 315 
             L 145 295 
             L 140 330 
             L 175 305 
             L 170 340 
             L 210 295 Z" 
          fill="#FFD700" 
          stroke="#B59410" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Ala Derecha -->
    <path d="M 330 260 
             C 380 260, 400 290, 395 315 
             L 355 295 
             L 360 330 
             L 325 305 
             L 330 340 
             L 290 295 Z" 
          fill="#FFD700" 
          stroke="#B59410" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- El cuerpo/cola central del ave bajo la Trifuerza -->
    <polygon points="250,295 265,335 250,355 235,335" fill="#D4AF37" stroke="#937508" stroke-width="2" />

    <!-- DETALLES DE LAS PIEDRAS ESPIRITUALES -->
    <polygon points="160,150 170,140 180,150 170,160" fill="#FF3333" stroke="#990000" stroke-width="1.5" />
    <polygon points="340,150 350,140 360,150 350,160" fill="#3399FF" stroke="#0055A5" stroke-width="1.5" />
    <polygon points="250,380 260,365 250,350 240,365" fill="#2ECC71" stroke="#196F3D" stroke-width="2" filter="drop-shadow(0px 0px 4px #2ECC71)" />

  </g>
</svg>

<header class="site-header">
<div class="container">
<div class="header-content">
<a href="{{ '/' | relative_url }}" class="logo">
<img src="{{ '/media/logo-icon.png' | relative_url }}" alt="TruchiEmu" width="32" height="32">
<span>TruchiEmu</span>
</a>

<nav class="main-nav">
{% for item in site.nav.en %}
<a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
{{ item.title }}
</a>
{% endfor %}
</nav>

<div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 3v2m0 14v2m-8.485-.515l1.414-1.414m12.728-12.728l1.414-1.414M4.93 4.93l1.414 1.414m12.728 12.728l1.414 1.414M3 12h2m14 0h2m-9 4a4 4 0 100-8 4 4 0 000 8z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      <div class="lang-switcher">
        {% assign first_seg = page.url | remove_first: '/' | split: '/' | first %}
        {% if first_seg == 'es' %}
          <a href="{{ '/' | relative_url }}" class="lang-link">EN</a>
          <span class="lang-link lang-active">ES</span>
          <a href="{{ '/pt/' | relative_url }}" class="lang-link">PT</a>
        {% elsif first_seg == 'pt' %}
          <a href="{{ '/' | relative_url }}" class="lang-link">EN</a>
          <a href="{{ '/es/' | relative_url }}" class="lang-link">ES</a>
          <span class="lang-link lang-active">PT</span>
        {% else %}
          <span class="lang-link lang-active">EN</span>
          <a href="{{ '/es/' | relative_url }}" class="lang-link">ES</a>
          <a href="{{ '/pt/' | relative_url }}" class="lang-link">PT</a>
        {% endif %}
      </div>
<a href="https://github.com/JuanchoGithub/truchiemu" class="btn btn-outline" target="_blank">
{{ site.data[site.active_lang].github }}
</a>
</div>
</div>
</div>
</header>
<div class="search-overlay" id="search-overlay">
<div class="search-container">
<input type="text" id="search-input" placeholder="{{ site.data[site.active_lang].search_placeholder }}" autofocus>
<button id="search-close" class="search-close">&times;</button>
<div id="search-results"></div>
</div>
</div>

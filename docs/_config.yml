title: "TruchiEmu Documentation"
description: "Complete documentation for the ultimate macOS retro gaming emulator"
author: "TruchiEmu Team"
baseurl: "/truchiemu"
repository: "JuanchoGithub/truchiemu"

markdown: kramdown
highlighter: rouge
# permalink: /:name.html

plugins:
- jekyll-sitemap
- jekyll-seo-tag
- jekyll-feed
- jekyll-optional-front-matter

exclude:
- Gemfile
- Gemfile.lock
- vendor
- LICENSE.txt
- scripts

defaults:
- scope:
    path: ""
  values:
    layout: "default"
    sidebar: true

sass:
sass_dir: _sass
style: compressed

kramdown:
input: GFM
hard_wrap: false
syntax_highlighter: rouge

vars:
  version: "1.11.0"
icon: "/media/logo-icon.png"

nav:
en:
- title: "Getting Started"
  url: "/getting-started.html"
- title: "Features"
  url: "/features.html"
- title: "Development"
  url: "/development.html"
es:
- title: "Primeros Pasos"
  url: "/getting-started.html"
- title: "Características"
  url: "/features.html"
- title: "Desarrollo"
  url: "/development.html"
pt:
- title: "Primeiros Passos"
  url: "/getting-started.html"
- title: "Recursos"
  url: "/features.html"
- title: "Desenvolvimento"
  url: "/development.html"

social:
github: JuanchoGithub/truchiemu
website: https://github.com/JuanchoGithub/truchiemu

analytics: false

url: "https://juanchogithub.github.io"

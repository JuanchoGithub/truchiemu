name: TruchiEmu
options:
  bundleIdPrefix: com.TruchiEmu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16"
schemes:
  TruchiEmu:
    build:
      targets:
        TruchiEmu: all

packages:
  rcheevos:
    url: https://github.com/RetroAchievements/rcheevos
    from: 12.3.0
  haishinkit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.2.0
  logboard:
    url: https://github.com/shogo4405/Logboard.git
    from: 2.6.0

targets:
  TruchiEmu:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    dependencies:
    - target: TruchiEmuCoreHost
      embed: true
    - package: rcheevos
    - package: haishinkit
      product: RTMPHaishinKit
    - package: haishinkit
      product: HaishinKit
    - package: logboard
      product: Logboard

    frameworks:
    - SwiftData

    info:
      path: TruchiEmu/Resources/Info.plist
      properties:
        CFBundleName: TruchiEmu
        CFBundleDisplayName: TruchiEmu
        CFBundleIdentifier: com.TruchiEmu.app
        CFBundleVersion: '32'
        CFBundleShortVersionString: "1.9.0"
        NSHumanReadableCopyright: "© 2026 TruchiEmu"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        LSApplicationCategoryType: public.app-category.games
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

        NSDownloadsFolderUsageDescription: "TruchiEmu needs access to Downloads to load ROMs and save states."
        NSDocumentsFolderUsageDescription: "TruchiEmu needs access to Documents to store emulator saves and configuration."
    entitlements:
      path: TruchiEmu/Resources/TruchiEmu.entitlements

    settings:
      base:
        PRODUCT_NAME: TruchiEmu
        PRODUCT_BUNDLE_IDENTIFIER: com.TruchiEmu.app
        SWIFT_OBJC_BRIDGING_HEADER: TruchiEmu/Core/Engine/TruchiEmu-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64"
        CODE_SIGN_ENTITLEMENTS: TruchiEmu/Resources/TruchiEmu.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5"
        HEADER_SEARCH_PATHS: "/opt/homebrew/include/SDL2 /usr/local/include/SDL2"
        LIBRARY_SEARCH_PATHS: "/opt/homebrew/lib /usr/local/lib"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: "-framework Metal -framework MetalKit -framework GameController -framework AVFoundation -framework WebKit -framework OpenGL -framework Network -framework SwiftData -larchive -L$(PROJECT_DIR)/TruchiEmu/lib -llibrashader_capi -lSDL2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LOG_DEBUG LOG_EXTREME"
        Release: {}

    sources:
    - path: TruchiEmu
      excludes:
      - "Library"
      - "Resources"
      - "lib"
      - "Core/Engine/internal/**"
      - "Core/Engine/RfDecoder/**"
      - "Core/Shaders/internal/**"
      - "Core/Shaders/all_shaders.metal"
      - "Core/XPC/Service/**"
    # The RF DSP pipeline (encoder + front-end + decoder) is self-contained
    # hot math; compile it optimized even in a Debug build so it doesn't run
    # at -O0 (which is ~7x slower and drops NES games to single-digit fps).
    - path: TruchiEmu/Core/Engine/RfDecoder/ntsc_encoder.cpp
      compilerFlags: -O3
    - path: TruchiEmu/Core/Engine/RfDecoder/dsp/ntsc_decoder.cpp
      compilerFlags: -O3
    - path: TruchiEmu/Core/Engine/RfDecoder/rf_decoder_bridge.mm
      compilerFlags: -O3
    - path: TruchiEmu/Core/Engine/RfDecoder/rf_dynamic_state.cpp
      compilerFlags: -O3
    - path: TruchiEmu/Resources
      excludes:
      - "slang-shaders/**"
      - "Info.plist"
      - "TruchiEmu.entitlements"
      buildPhase: resources

    postBuildScripts:
      - name: Embed librashader dylib
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp -f "$PROJECT_DIR/TruchiEmu/lib/librashader.dylib" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          install_name_tool -id @rpath/librashader.dylib "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/librashader.dylib"
        basedOnDependencyAnalysis: false
      - name: Embed SDL2 dylib
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp -f /opt/homebrew/lib/libSDL2-2.0.0.dylib "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          install_name_tool -id @rpath/libSDL2-2.0.0.dylib "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/libSDL2-2.0.0.dylib"
        basedOnDependencyAnalysis: false
      - name: Copy slang-shaders to bundle
        script: |
          SRC="$PROJECT_DIR/TruchiEmu/Resources/slang-shaders"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/slang-shaders"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -R "$SRC"/ "$DST"
        basedOnDependencyAnalysis: false
      - name: Re-sign dylibs and app bundle
        script: |
          FW="$CODESIGNING_FOLDER_PATH/Contents/Frameworks"
          for dylib in "$FW"/*.dylib; do
            codesign --force --sign - "$dylib"
          done
          codesign --force --deep --sign - "$CODESIGNING_FOLDER_PATH"
        basedOnDependencyAnalysis: false

  TruchiEmuCoreHost:
    type: xpc-service
    platform: macOS
    deploymentTarget: "14.0"
    entitlements:
      path: TruchiEmu/Core/XPC/Service/CoreHost.entitlements
    settings:
      base:
        PRODUCT_NAME: TruchiEmuCoreHost
        PRODUCT_BUNDLE_IDENTIFIER: com.TruchiEmu.CoreHost
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TruchiEmu/Core/XPC/Service/Info.plist
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5"
        SWIFT_OBJC_BRIDGING_HEADER: TruchiEmu/Core/Engine/TruchiEmu-Bridging-Header.h
        OTHER_LDFLAGS: "-framework AVFoundation -framework OpenGL -framework IOSurface"
        GCC_PREPROCESSOR_DEFINITIONS: "XPC_SERVICE=1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "XPC_SERVICE DEBUG LOG_DEBUG LOG_EXTREME"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "XPC_SERVICE"
    sources:
    - path: TruchiEmu/Core/XPC/Service
    - path: TruchiEmu/Core/XPC/Shared
    - path: TruchiEmu/Core/Engine
      excludes:
      - "RfDecoder/tests/**"
      - "slang/**"
      - "slang_shader_bridge.*"
      - "internal/**"
      - "Runners/**"
      - "LibretroBridgeSwift.swift"
      - "Hashing/**"
      - "CoreOverrideBridge.mm"
    - path: TruchiEmu/Services/CoreOverrideService.swift
    - path: TruchiEmu/Shared/Services/LoggerService.swift
    - path: TruchiEmu/Shared/Services/LogManager.swift

    dependencies:
    - package: rcheevos

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Holo Card</title>
<link rel="stylesheet" href="card.css" />
</head>
<body>
<div class="card interactive {{VARIANT_CLASS}} {{FIT_MODE_CLASS}}" id="card"
     data-set="" data-number="" data-subtypes="basic"
     data-supertype="pokémon" data-rarity="" data-trainer-gallery="false"
     data-foilmask="{{FOIL_MASK_ATTR}}"
      style="--foilmask: {{FOIL_MASK_VAR}};">
  <div class="card__translater">
    <div class="card__rotator">
      <div class="card__front" style="--cosmosbg: 367px 640px; --seedx: 0.5; --seedy: 0.5;">
        <!-- Blurred background layer (fills entire card frame) -->
        <div class="card__bg-blur" style="background-image: url({{BLUR_IMAGE_URL}});"></div>
        <!-- Sharp artwork (contained, centered - shows full image) -->
        <img class="cardimg" src="{{IMAGE_URL}}" alt="" />
        <div class="card__shine"></div>
        <div class="card__glare"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // --- helpers (mirror src/lib/helpers/Math.js) ---
  var clamp = function (v, min, max) {
    if (min === undefined) min = 0;
    if (max === undefined) max = 100;
    return Math.min(Math.max(v, min), max);
  };
  var round = function (v, p) {
    if (p === undefined) p = 3;
    return parseFloat(v.toFixed(p));
  };
  var adjust = function (v, fromMin, fromMax, toMin, toMax) {
    return round(toMin + (toMax - toMin) * (v - fromMin) / (fromMax - fromMin));
  };

  var card = document.getElementById("card");
  if (!card) return;

  // --- variant class -> data-rarity mapping (CSS keys off data-rarity) ---
  var RARITY_MAP = {
    "regular-holo": { rarity: "rare holo" },
    "cosmos-holo":  { rarity: "rare holo cosmos" },
    "rainbow-holo": { rarity: "rare rainbow" },
    "radiant-holo": { rarity: "radiant rare" },
    "amazing-rare": { rarity: "amazing rare" },
    "shiny-rare":   { rarity: "rare shiny" },
    "v-full-art":   { rarity: "rare ultra", supertype: "pokémon", subtypes: "basic" },
    "secret-rare":  { rarity: "rare secret" },
    "reverse-holo": { rarity: "reverse holo" }
  };

  var variant = "regular-holo";
  for (var key in RARITY_MAP) {
    if (RARITY_MAP.hasOwnProperty(key) && card.classList.contains(key)) {
      variant = key;
      break;
    }
  }
  var cfg = RARITY_MAP[variant] || RARITY_MAP["regular-holo"];

  card.setAttribute("data-rarity", cfg.rarity);
  if (cfg.supertype) card.setAttribute("data-supertype", cfg.supertype);
  if (cfg.subtypes) card.setAttribute("data-subtypes", cfg.subtypes);
  card.setAttribute("data-trainer-gallery", "false");
  card.classList.add("interactive");

  // --- apply pointer state to the .card element (the CSS reads these) ---
  function setPointer(px, py) {
    px = clamp(round(px));
    py = clamp(round(py));
    var cx = px - 50;
    var cy = py - 50;
    var fromCenter = clamp(Math.sqrt(cx * cx + cy * cy) / 50, 0, 1);

    card.style.setProperty("--pointer-x", px + "%");
    card.style.setProperty("--pointer-y", py + "%");
    card.style.setProperty("--pointer-from-center", fromCenter.toFixed(4));
    card.style.setProperty("--pointer-from-top", (py / 100).toFixed(4));
    card.style.setProperty("--pointer-from-left", (px / 100).toFixed(4));
    // extra standard-contract vars (not all CSS reads them, but kept for parity)
    card.style.setProperty("--pointer-angle", (Math.atan2(cy, cx) * 180 / Math.PI).toFixed(2) + "deg");
    card.style.setProperty("--pointer-distance", fromCenter.toFixed(4));
    // background parallax follow, same remap the component uses
    card.style.setProperty("--background-x", adjust(px, 0, 100, 37, 63).toFixed(2) + "%");
    card.style.setProperty("--background-y", adjust(py, 0, 100, 33, 67).toFixed(2) + "%");
    // keep the holo visible at all times
    card.style.setProperty("--card-opacity", "1");
  }

    // initial centred shine (visible before first move)
    setPointer(50, 50);

    // Allow the host app (SwiftUI) to drive the pointer directly, so the
    // WKWebView can stay hit-testing-disabled and let the card keep its own
    // mouse handling. Expects percentages 0..100.
    window.setHoloPointer = setPointer;

  function onMove(e) {
    var clientX = e.clientX;
    var clientY = e.clientY;
    if (e.touches && e.touches.length) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    }
    if (clientX === undefined || clientY === undefined) return;

    var rect = card.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    var ax = clientX - rect.left;
    var ay = clientY - rect.top;
    var px = clamp(round((100 / rect.width) * ax));
    var py = clamp(round((100 / rect.height) * ay));

    setPointer(px, py);
    card.classList.add("interacting");
  }

  window.addEventListener("pointermove", onMove, { passive: true });
  window.addEventListener("mousemove", onMove, { passive: true });
  window.addEventListener("touchmove", onMove, { passive: true });
})();
</script>
</body>
</html>

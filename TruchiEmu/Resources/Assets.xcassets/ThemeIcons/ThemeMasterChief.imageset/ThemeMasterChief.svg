<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente para tu app -->
  <g id="MasterChief_Real_Halo_Icon">
    
    <!-- Contorno Oscuro Metálico -->
    <circle cx="250" cy="250" r="180" fill="#2E3D26" stroke="#161F13" stroke-width="6" />
    
    <!-- Círculo Central (Verde Oliva Mjolnir) -->
    <circle cx="250" cy="250" r="155" fill="#435837" />
    
    <!-- Visera Superior (La "gorrita" clásica del casco de Halo que cubre el visor) -->
    <path d="M 130 185 
             C 180 170, 320 170, 370 185 
             L 360 160 
             C 310 145, 190 145, 140 160 Z" 
          fill="#1E2919" 
          stroke="#161F13" 
          stroke-width="2" />

    <!-- El Visor de Halo: Es una banda ancha, continua y curva (no angular como DOOM) -->
    <path d="M 135 195 
             C 180 180, 320 180, 365 195
             C 380 235, 370 270, 345 275
             C 290 285, 210 285, 155 275
             C 130 270, 120 235, 135 195 Z" 
          fill="#E5A922" 
          stroke="#9E700A" 
          stroke-width="5" 
          filter="drop-shadow(0px 4px 8px rgba(229,169,34,0.5))" />
          
    <!-- Brillo característico del visor (Líneas horizontales de reflejo) -->
    <path d="M 150 205 C 200 195, 300 195, 350 205 L 345 215 C 300 205, 200 205, 155 215 Z" fill="#FFF3CD" opacity="0.4" />
    <path d="M 160 230 C 200 222, 300 222, 340 230" fill="none" stroke="#FFF3CC" stroke-width="3" opacity="0.2" />

    <!-- Entradas de aire circulares inferiores (A los lados de la boca, típicas de Cortana/Halo 3) -->
    <circle cx="195" cy="325" r="14" fill="#161F13" />
    <circle cx="195" cy="325" r="8" fill="#2E3D26" />
    
    <circle cx="305" cy="325" r="14" fill="#161F13" />
    <circle cx="305" cy="325" r="8" fill="#2E3D26" />

    <!-- Placa central de la mandíbula (Limpia, sin rejillas tipo DOOM) -->
    <path d="M 225 310 L 275 310 L 265 365 L 235 365 Z" fill="#161F13" />
    <line x1="250" y1="315" x2="250" y2="360" stroke="#435837" stroke-width="4" stroke-linecap="round" />

    <!-- Pequeñas luces de transporte/linternas en los costados del casco -->
    <path d="M 105 210 L 115 230 L 100 225 Z" fill="#00D2FF" filter="drop-shadow(0px 0px 4px #00D2FF)" />
    <path d="M 395 210 L 385 230 L 400 225 Z" fill="#00D2FF" filter="drop-shadow(0px 0px 4px #00D2FF)" />
          
  </g>
</svg>

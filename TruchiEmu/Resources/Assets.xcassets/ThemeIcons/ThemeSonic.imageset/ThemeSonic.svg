<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente para tu app -->
  <g id="Sonic_Perfect_Curved_Spikes">
    
    <!-- Contorno Azul Oscuro Base del Marco -->
    <circle cx="250" cy="250" r="180" fill="#001C55" stroke="#000B29" stroke-width="6" />
    
    <!-- Fondo del Círculo -->
    <circle cx="250" cy="250" r="155" fill="#0056B3" />

    <!-- OREJA TRASERA -->
    <path d="M 215 125 L 185 65 L 230 95 Z" fill="#002D62" opacity="0.6" />

    <!-- LAS AGUJAS CURVADAS (Garras/Espinas que barren hacia atrás y abajo) -->
    <!-- Curva superior hacia la punta afilada, y quiebre recto por abajo -->
    <path d="M 230 110 
             C 170 100, 100 110, 45 155 
             L 165 195 
             C 110 205, 70 220, 30 265 
             L 165 275 
             C 115 295, 85 330, 70 380 
             L 190 315
             L 215 320 Z" 
          fill="#0056B3" 
          stroke="#000B29" 
          stroke-width="5" 
          stroke-linejoin="miter" 
          stroke-miterlimit="3" />

    <!-- OREJA DELANTERA -->
    <path d="M 255 120 L 225 35 L 275 80 Z" fill="#0056B3" stroke="#000B29" stroke-width="5" stroke-linejoin="round" />
    <path d="M 248 110 L 235 60 L 265 85 Z" fill="#FFCCD5" />

    <!-- CUERPO DE LA CABEZA -->
    <path d="M 220 120 C 260 105, 315 125, 325 180 C 330 205, 310 235, 275 245 Z" fill="#0056B3" />

    <!-- EL OJO -->
    <path d="M 250 220 
             C 245 155, 310 135, 325 200 
             C 328 220, 305 245, 265 240 Z" 
          fill="#FFFFFF" 
          stroke="#000B29" 
          stroke-width="5" 
          stroke-linejoin="round" />
          
    <!-- Ceja desafiante -->
    <path d="M 235 165 C 270 140, 310 150, 335 170" fill="none" stroke="#000B29" stroke-width="6" stroke-linecap="round" />

    <!-- Pupila e Iris -->
    <ellipse cx="300" cy="190" rx="9" ry="17" fill="#000000" />
    <ellipse cx="300" cy="190" rx="5" ry="12" fill="#0080FF" />
    <circle cx="297" cy="180" r="3" fill="#FFFFFF" />

    <!-- HOCICO ANATÓMICO (Limpio y bien integrado) -->
    <path d="M 260 235 
             C 275 235, 300 230, 320 238
             C 340 245, 365 250, 375 260 
             L 360 285
             C 345 305, 310 330, 265 320
             C 240 315, 225 295, 220 275
             C 225 255, 245 235, 260 235 Z" 
          fill="#FFE5D9" 
          stroke="#000B29" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Conexión del Cuello -->
    <path d="M 220 275 L 225 325 L 195 315 Z" fill="#FFE5D9" />

    <!-- Sonrisa pícara -->
    <path d="M 290 290 C 315 298, 335 288, 345 278" fill="none" stroke="#000B29" stroke-width="4.5" stroke-linecap="round" />

    <!-- LA NARIZ -->
    <ellipse cx="384" cy="256" rx="11" ry="6" fill="#000000" transform="rotate(-25 384 256)" />
    <circle cx="380" cy="252" r="2" fill="#FFFFFF" />

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente para tu app -->
  <g id="Protoss_True_Zealot_Icon">
    
    <!-- Contorno Oscuro Espacial de Base -->
    <circle cx="250" cy="250" r="180" fill="#0D131A" stroke="#05080C" stroke-width="6" />
    
    <!-- Fondo del círculo (Nebulosa/Espacio Profundo) -->
    <circle cx="250" cy="250" r="155" fill="#141E28" />

    <!-- APÉNDICES NERVIOSOS (Los "cables" neuronales Protoss que caen por detrás) -->
    <path d="M 160 220 C 130 280, 140 360, 170 395" fill="none" stroke="#1A2530" stroke-width="16" stroke-linecap="round" />
    <path d="M 160 220 C 130 280, 140 360, 170 395" fill="none" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" />
    
    <path d="M 340 220 C 370 280, 360 360, 330 395" fill="none" stroke="#1A2530" stroke-width="16" stroke-linecap="round" />
    <path d="M 340 220 C 370 280, 360 360, 330 395" fill="none" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" />

    <!-- CABEZA PROTOSS: Alargada, pómulos altos, sin boca ni nariz -->
    <path d="M 210 110 
             C 210 60, 290 60, 290 110 
             C 290 150, 310 180, 305 210
             L 250 290 
             L 195 210
             C 190 180, 210 150, 210 110 Z" 
          fill="#34495E" 
          stroke="#1F2C39" 
          stroke-width="4" 
          stroke-linejoin="round" />
          
    <!-- Sombra facial para acentuar la barbilla afilada y la frente cónica -->
    <path d="M 250 72 C 290 72, 290 110, 290 150 C 290 180, 310 180, 305 210 L 250 290 Z" fill="#2C3E50" opacity="0.6" />

    <!-- Crestas óseas en la frente de la raza -->
    <path d="M 230 110 L 250 135 L 270 110" fill="none" stroke="#1F2C39" stroke-width="3" />
    <path d="M 235 90 L 250 110 L 265 90" fill="none" stroke="#1F2C39" stroke-width="3" />

    <!-- OJOS PSIÓNICOS: Angulares, brillantes y sin pupilas -->
    <path d="M 205 170 L 240 182 L 235 192 L 210 185 Z" fill="#00FFFF" filter="drop-shadow(0px 0px 8px #00FFFF)" />
    <path d="M 295 170 L 260 182 L 265 192 L 290 185 Z" fill="#00FFFF" filter="drop-shadow(0px 0px 8px #00FFFF)" />

    <!-- ARMADURA DE JANO/FORJADA (Cubre hombros y rodea el cuello) -->
    <!-- Collarín masivo que sube hacia las mejillas -->
    <path d="M 165 240 
             L 200 230 
             L 215 265 
             L 250 275 
             L 285 265 
             L 300 230 
             L 335 240
             L 360 300
             C 320 370, 180 370, 140 300 Z" 
          fill="#D4AF37" 
          stroke="#8A6D1C" 
          stroke-width="4" 
          stroke-linejoin="round" />

    <!-- Hombreras curvas e imponentes que se adaptan al borde inferior del círculo -->
    <path d="M 145 295 C 145 295, 135 340, 175 385 C 200 365, 205 320, 205 320 Z" fill="#B8972F" stroke="#8A6D1C" stroke-width="3" />
    <path d="M 355 295 C 355 295, 365 340, 325 385 C 300 365, 295 320, 295 320 Z" fill="#B8972F" stroke="#8A6D1C" stroke-width="3" />

    <!-- Cristal de Khaydarin central en el pecho (Fuente de poder) -->
    <polygon points="250,295 265,320 250,345 235,320" fill="#00D2FF" stroke="#0080A5" stroke-width="3" filter="drop-shadow(0px 0px 10px #00FFFF)" />
    
    <!-- Detalles rúnicos/tecnológicos en el collarín dorado -->
    <path d="M 185 270 L 210 310" stroke="#5C4812" stroke-width="3" stroke-linecap="round" />
    <path d="M 315 270 L 290 310" stroke="#5C4812" stroke-width="3" stroke-linecap="round" />

  </g>
</svg>

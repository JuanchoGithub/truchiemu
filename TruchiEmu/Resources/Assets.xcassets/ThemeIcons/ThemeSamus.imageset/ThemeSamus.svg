<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente para tu app -->
  <g id="Samus_Aran_Varia_Suit_Icon">
    
    <!-- Contorno de la base del casco (Rojo brillante del Varia Suit) -->
    <circle cx="250" cy="250" r="180" fill="#990000" stroke="#4A0000" stroke-width="6" />
    
    <!-- Círculo Central (Rojo principal del casco de Samus) -->
    <circle cx="250" cy="250" r="155" fill="#CC0000" />
    
    <!-- Sombra interna para dar volumen esférico al casco -->
    <path d="M 250 95 C 335 95, 405 165, 405 250 C 405 335, 335 405, 250 405 Z" fill="#7A0000" opacity="0.4" />

    <!-- Placa superior de la frente (Diseño aerodinámico amarillo/dorado) -->
    <path d="M 180 120 
             C 210 100, 290 100, 320 120 
             L 300 155 
             L 250 165 
             L 200 155 Z" 
          fill="#FFCC00" 
          stroke="#997A00" 
          stroke-width="3" 
          stroke-linejoin="round" />
          
    <!-- La icónica gema/sensor verde en la frente -->
    <polygon points="250,115 258,130 250,145 242,130" fill="#00FF66" stroke="#009933" stroke-width="2" filter="drop-shadow(0px 0px 4px #00FF66)" />

    <!-- EL VISOR EN FORMA DE "T" (Verde traslúcido característico de Metroid Prime) -->
    <path d="M 140 190 
             L 360 190 
             L 345 230 
             L 275 245 
             L 275 310 
             L 225 310 
             L 225 245 
             L 155 230 Z" 
          fill="#00FF66" 
          stroke="#009933" 
          stroke-width="5" 
          stroke-linejoin="round"
          filter="drop-shadow(0px 0px 12px rgba(0,255,102,0.6))" />
          
    <!-- Brillo interno del visor (Efecto de interfaz HUD encendida) -->
    <path d="M 155 200 L 345 200 L 335 215 L 260 225 L 260 300 L 240 300 L 240 225 L 165 215 Z" fill="#CCFFDD" opacity="0.4" />

    <!-- Respiradores/Tubos laterales inferiores (Color verde oscuro/gris que enmarca la mandíbula) -->
    <!-- Izquierdo -->
    <path d="M 150 260 C 145 300, 170 345, 210 365 L 215 340 C 185 325, 170 295, 175 260 Z" fill="#2F4F4F" stroke="#1A2E2E" stroke-width="2" />
    <circle cx="212" cy="352" r="6" fill="#FFCC00" /> <!-- Detalle de perno dorado -->

    <!-- Derecho -->
    <path d="M 350 260 C 355 300, 330 345, 290 365 L 285 340 C 315 325, 330 295, 325 260 Z" fill="#2F4F4F" stroke="#1A2E2E" stroke-width="2" />
    <circle cx="288" cy="352" r="6" fill="#FFCC00" />

    <!-- Placa inferior de la barbilla (Línea que une los respiradores) -->
    <path d="M 225 350 L 275 350 L 265 375 L 235 375 Z" fill="#1A2E2E" />

    <!-- Líneas de estructura del casco (Acentúan la forma de las mejillas) -->
    <path d="M 140 190 L 175 260" stroke="#4A0000" stroke-width="4" stroke-linecap="round" />
    <path d="M 360 190 L 325 260" stroke="#4A0000" stroke-width="4" stroke-linecap="round" />
          
  </g>
</svg>
